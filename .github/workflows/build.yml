name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Prepare
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: '5.12.x'
      - uses: gittools/actions/gitversion/execute@v1.1.1
        id: gitversion

      # Build
      - name: Inject version number
        run: sed -i "s/^version = '.*'$/version = '${{steps.gitversion.outputs.legacySemVer}}'/" 0bootstrap
      - uses: 0install/github-actions/0template@v1
        id: feed
        with:
          template: 0bootstrap.xml.template
          version: ${{steps.gitversion.outputs.legacySemVer}}
          github-release: ${{github.ref_type == 'tag'}}
      #- name: 0test
      #  run: 0install run https://apps.0install.net/0install/0test.xml 0bootstrap-${{steps.gitversion.outputs.legacySemVer}}.xml

      # Release
      - name: Get tag message
        if: github.ref_type == 'tag'
        id: tag_message
        run: |
          {
            echo "message<<EOF"
            git fetch -f origin tag ${{github.ref_name}}
            git tag -l ${{github.ref_name}} --format="%(contents)"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body: |
            **[Documentation and download instructions](https://docs.0install.net/tools/0bootstrap/)**
            ## Changes
            ${{steps.tag_message.outputs.message}}
          files: |
            ${{steps.feed.outputs.feed}}
            ${{steps.feed.outputs.archive}}

      # Publish
      - uses: 0install/github-actions/0repo-submit@v1
        if: github.ref_type == 'tag'
        with:
          repository: 0install/apps
          feed-url: ${{steps.feed.outputs.feed}}
          token: ${{secrets.PERSONAL_TOKEN}}
